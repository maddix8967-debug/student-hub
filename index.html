<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;

body {

    color: #fff;

    overflow-x: hidden;

/* =========================
   ANIMATED BACKGROUND SYSTEM
========================= */
.background{position:fixed;inset:0;z-index:-10;overflow:hidden;isolation:isolate;background:#030612;transition:background 1s ease}
.background:before{content:"";position:absolute;inset:-45%;background:radial-gradient(ellipse at 50% 48%,rgba(255,255,255,.72) 0%,rgba(165,190,255,.36) 7%,rgba(112,92,220,.24) 18%,rgba(35,72,150,.18) 29%,transparent 53%),radial-gradient(ellipse at 30% 55%,rgba(255,150,210,.18),transparent 40%),radial-gradient(ellipse at 70% 35%,rgba(75,205,255,.18),transparent 42%);filter:blur(24px);transform:rotate(-24deg);animation:milkyway 38s ease-in-out infinite alternate;pointer-events:none}
.background:after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(116,205,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(116,205,255,.055) 1px,transparent 1px);background-size:58px 58px;mask-image:linear-gradient(to bottom,transparent,black 40%,black);animation:gridFloat 22s linear infinite;pointer-events:none}
.starfield{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 12% 22%,#fff,transparent),radial-gradient(1px 1px at 27% 71%,#d9e8ff,transparent),radial-gradient(2px 2px at 74% 18%,#fff,transparent),radial-gradient(1px 1px at 86% 62%,#fff,transparent),radial-gradient(1px 1px at 52% 38%,#d5caff,transparent),radial-gradient(2px 2px at 42% 86%,#fff,transparent);background-size:390px 310px;opacity:.8;animation:starDrift 75s linear infinite}
body[data-theme="aurora"] .background:before{background:radial-gradient(ellipse at 30% 60%,rgba(0,255,190,.34),transparent 38%),radial-gradient(ellipse at 70% 30%,rgba(80,100,255,.38),transparent 42%),radial-gradient(ellipse at 55% 70%,rgba(190,70,255,.22),transparent 42%);transform:rotate(-15deg)}
body[data-theme="sunset"] .background:before{background:radial-gradient(ellipse at 50% 70%,rgba(255,95,75,.42),transparent 40%),radial-gradient(ellipse at 25% 35%,rgba(255,165,65,.3),transparent 38%),radial-gradient(ellipse at 75% 30%,rgba(185,65,180,.3),transparent 42%);transform:rotate(10deg)}
body[data-theme="matrix"] .background:before{background:radial-gradient(ellipse at 50% 45%,rgba(0,255,100,.28),transparent 48%),radial-gradient(ellipse at 20% 80%,rgba(0,160,80,.18),transparent 40%);transform:rotate(0)}
@keyframes milkyway{0%{transform:translate(-3%,2%) rotate(-27deg) scale(1)}100%{transform:translate(4%,-3%) rotate(-17deg) scale(1.16)}}
@keyframes starDrift{from{transform:translateY(0)}to{transform:translateY(-310px)}}
@keyframes gridFloat{from{transform:translateY(0)}to{transform:translateY(58px)}}
@keyframes stars{from{transform:translateY(0)}to{transform:translateY(-120px)}}
@keyframes glowPulse{0%,100%{filter:drop-shadow(0 0 7px rgba(76,213,255,.25))}50%{filter:drop-shadow(0 0 22px rgba(190,83,255,.6))}}
@keyframes riseIn{from{opacity:0;transform:translateY(28px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}

/* =========================
   CITY
========================= */

.city {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 40%;
    display: flex;
    align-items: flex-end;
    gap: 5px;
    opacity: .58;
    filter: drop-shadow(0 0 18px rgba(80,190,255,.28));
}

.building {
    position: relative;
    width: clamp(25px, 5vw, 75px);
    background: linear-gradient(to top, #050505, #191919);
    border-top: 1px solid rgba(255,255,255,.08);
}

.building::before {
    content: "";
    position: absolute;
    inset: 12px 7px;
    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,.15) 0px,
            rgba(255,255,255,.15) 2px,
            transparent 2px,
            transparent 13px
        );
    opacity: .35;
}

.b1 { height: 45%; }
.b2 { height: 65%; }
.b3 { height: 35%; }
.b4 { height: 78%; }
.b5 { height: 53%; }
.b6 { height: 90%; }
.b7 { height: 48%; }
.b8 { height: 72%; }
.b9 { height: 42%; }
.b10 { height: 62%; }
.b11 { height: 83%; }
.b12 { height: 50%; }
.b13 { height: 68%; }
.b14 { height: 38%; }
.b15 { height: 76%; }
.b16 { height: 57%; }
.b17 { height: 88%; }
.b18 { height: 45%; }

/* LOADING / WELCOME SCREEN */
#intro{background:radial-gradient(ellipse at center,rgba(12,25,60,.88),#02040c 72%)}
#intro:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(130,190,255,.12),transparent 65%);transform:translateX(-100%);animation:scan 3s ease-in-out infinite}
@keyframes scan{to{transform:translateX(100%)}}
.loader-orbit{width:110px;height:110px;border:1px solid rgba(160,210,255,.25);border-radius:50%;margin:0 auto 28px;position:relative;box-shadow:0 0 35px rgba(95,150,255,.2),inset 0 0 25px rgba(95,150,255,.12);animation:orbitPulse 2.5s ease-in-out infinite}
.loader-orbit:before,.loader-orbit:after{content:"";position:absolute;inset:12px;border:2px solid transparent;border-top-color:#8cecff;border-right-color:#a68cff;border-radius:50%;animation:spin 2s linear infinite}
.loader-orbit:after{inset:25px;border-top-color:#ff9bdc;border-right-color:transparent;animation-duration:1.4s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes orbitPulse{50%{transform:scale(1.08);box-shadow:0 0 55px rgba(95,150,255,.42)}}
.loading-label{font-size:10px;letter-spacing:5px;color:#b9d5ff;margin-top:18px}
.loading-track{width:min(270px,70vw);height:3px;background:rgba(255,255,255,.12);border-radius:9px;margin:15px auto 0;overflow:hidden}
.loading-fill{height:100%;width:0;background:linear-gradient(90deg,#5ce1ff,#a58bff,#ff8bd5);box-shadow:0 0 15px #8e9fff;animation:loadbar 2.3s ease forwards}
@keyframes loadbar{to{width:100%}}
.bg-picker{position:fixed;top:20px;left:20px;z-index:5001;display:flex;gap:7px;align-items:center;flex-wrap:wrap;max-width:calc(100vw - 40px)}
.bg-picker button{border:1px solid rgba(190,215,255,.28);background:rgba(5,12,30,.68);color:#fff;border-radius:999px;padding:9px 12px;font:700 9px Manrope,sans-serif;letter-spacing:1px;cursor:pointer;backdrop-filter:blur(12px)}
.bg-picker button[aria-pressed="true"]{background:rgba(125,150,255,.3);border-color:#a9c9ff;box-shadow:0 0 18px rgba(100,160,255,.3)}
@media(max-width:700px){.bg-picker{top:58px;left:10px;gap:5px}.bg-picker button{font-size:8px;padding:8px}.controls{top:12px;right:10px}}

/* =========================
   INTRO
========================= */

#intro {
    position: fixed;
    inset: 0;
    z-index: 10000;
    background:
        radial-gradient(circle at center, #202020 0%, #0b0b0b 65%, #050505 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    transition: opacity 1s ease, visibility 1s ease;
    overflow:hidden;
}
#intro::before{content:"";position:absolute;inset:-30%;background:conic-gradient(from 0deg,transparent,rgba(65,210,255,.15),transparent,rgba(190,75,255,.18),transparent);filter:blur(45px);animation:nebulaDrift 14s ease-in-out infinite alternate}
.intro-content{position:relative;z-index:1;animation:riseIn 1.2s both}

#intro.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.intro-content h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(55px, 12vw, 140px);
    font-weight: 500;
    letter-spacing: 10px;
}

.intro-content p {
    margin-top: 18px;
    font-size: 11px;
    letter-spacing: 6px;
    color: #aaa;
}

.enter-btn {
    margin-top: 45px;
    padding: 15px 35px;
    border: 1px solid rgba(255,255,255,.3);
    border-radius: 100px;
    background: rgba(255,255,255,.05);
    color: white;
    font-family: 'Manrope', sans-serif;
    letter-spacing: 4px;
    font-size: 11px;
    cursor: pointer;
    transition: .3s ease;
}

.enter-btn:hover {
    background: white;
    color: black;
    transform: scale(1.05);
}

/* =========================
   MAIN
========================= */

.main {
    width: min(1100px, 92%);
    margin: auto;
    padding: 60px 0 100px;
}

.header {
    text-align: center;
    margin-bottom: 55px;
}

.header h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(55px, 9vw, 100px);
    font-weight: 500;
    letter-spacing: 4px;
    background: linear-gradient(100deg,#fff 10%,#8deaff 45%,#d3a1ff 75%,#fff);
    background-size:220% auto; -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:titleFlow 8s linear infinite;
}
@keyframes titleFlow {to{background-position:220% center}}

.header p {
    margin-top: 5px;
    color: #999;
    font-size: 11px;
    letter-spacing: 5px;
}

/* =========================
   CONTROLS
========================= */

.controls {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 5000;
    display: flex;
    gap: 10px;
}

.control-btn {
    padding: 11px 15px;
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 12px;
    background: rgba(8,16,35,.58);
    color: white;
    font-family: 'Manrope', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    backdrop-filter: blur(15px);
    box-shadow:0 0 18px rgba(65,190,255,.10);
    transition: .25s ease;
}

.control-btn:hover {
    background: rgba(255,255,255,.15);
    transform: translateY(-2px);
}

/* =========================
   CARDS
========================= */

.links {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 25px;
}

.card {
    position: relative;
    padding: 18px;
    border-radius: 22px;
    background: linear-gradient(
        145deg,
        rgba(65,65,65,.72),
        rgba(25,25,25,.78)
    );
    border: 1px solid rgba(255,255,255,.13);
    box-shadow:
        0 20px 60px rgba(0,0,0,.4),
        inset 0 1px 0 rgba(255,255,255,.08);
    backdrop-filter: blur(18px);
    transition: transform .45s cubic-bezier(.2,.8,.2,1), border-color .35s ease, box-shadow .35s ease;
    animation: riseIn .8s both, glowPulse 7s ease-in-out infinite;
}
.card:nth-child(2){animation-delay:.08s,.2s}.card:nth-child(3){animation-delay:.16s,.4s}.card:nth-child(4){animation-delay:.24s,.6s}.card:nth-child(5){animation-delay:.32s,.8s}.card:nth-child(6){animation-delay:.4s,1s}.card:nth-child(7){animation-delay:.48s,1.2s}.card:nth-child(8){animation-delay:.56s,1.4s}

.card:hover {
    transform: translateY(-7px);
    border-color: rgba(117,220,255,.65);
    box-shadow: 0 24px 75px rgba(0,0,0,.5), 0 0 28px rgba(91,178,255,.18), inset 0 1px 0 rgba(255,255,255,.14);
}

.card-title {
    margin-bottom: 15px;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 3px;
    text-align: center;
}

.card-image {
    width: 100%;
    height: 220px;
    object-fit: cover;
    border-radius: 15px;
    display: block;
    border: 1px solid rgba(255,255,255,.1);
}

.placeholder {
    height: 220px;
    border-radius: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(circle, rgba(255,255,255,.08), transparent 65%),
        #151515;
    border: 1px solid rgba(255,255,255,.1);
    font-size: 25px;
    letter-spacing: 4px;
}

.play-btn {
    width: 100%;
    margin-top: 15px;
    padding: 14px;
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 12px;
    background: rgba(255,255,255,.07);
    color: white;
    font-family: 'Manrope', sans-serif;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 3px;
    cursor: pointer;
    transition: .25s ease;
}

.play-btn:hover {
    background: linear-gradient(100deg,#8deaff,#d5a1ff);
    color: #070914;
    box-shadow:0 0 25px rgba(113,203,255,.35);
}

/* =========================
   MODAL
========================= */

.modal {
    position: fixed;
    inset: 0;
    z-index: 9000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0,0,0,.72);
    backdrop-filter: blur(15px);
}

.modal.active {
    display: flex;
}

.modal-box {
    width: min(500px, 100%);
    max-height: 90vh;
    overflow-y: auto;
    padding: 30px;
    border-radius: 25px;
    background: rgba(25,25,25,.94);
    border: 1px solid rgba(255,255,255,.16);
    box-shadow: 0 30px 100px rgba(0,0,0,.7);
}

.modal-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 40px;
    text-align: center;
    margin-bottom: 25px;
}

.option {
    width: 100%;
    display: block;
    padding: 15px;
    margin-top: 10px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.15);
    background: rgba(255,255,255,.06);
    color: white;
    text-decoration: none;
    text-align: center;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 2px;
    transition: .25s ease;
}

.option:hover {
    background: white;
    color: black;
}

.close-btn {
    width: 100%;
    margin-top: 20px;
    padding: 13px;
    border: none;
    border-radius: 12px;
    background: #333;
    color: white;
    cursor: pointer;
}


/* OTHERS DIRECTORY */
.others-placeholder { flex-direction:column; gap:10px; background:radial-gradient(circle at 50% 35%,rgba(160,160,255,.18),transparent 58%),linear-gradient(135deg,#24242c,#101014); }
.others-placeholder span { font-size:42px; color:#d9d5ff; text-shadow:0 0 25px #a49aff; }
.others-placeholder strong { font-size:19px; letter-spacing:4px; }
.others-placeholder small { font-size:9px; letter-spacing:2px; color:#aaa; }
.others-search { width:100%; padding:13px 15px; margin:0 0 12px; border:1px solid rgba(255,255,255,.2); border-radius:12px; outline:none; background:rgba(255,255,255,.08); color:#fff; font:inherit; }
.others-count { color:#aaa; font-size:10px; letter-spacing:2px; text-align:center; margin-bottom:12px; }
.others-list { max-height:52vh; overflow-y:auto; padding-right:4px; }
.others-list .option { text-align:left; letter-spacing:.5px; overflow-wrap:anywhere; }

/* =========================
   MOBILE
========================= */

@media (prefers-reduced-motion: reduce) { *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important} }

@media (max-width: 700px) {
    .main {
        padding-top: 85px;
    }

    .links {
        grid-template-columns: 1fr;
    }

    .card-image,
    .placeholder {
        height: 200px;
    }

    .controls {
        top: 12px;
        right: 12px;
    }

    .control-btn {
        padding: 9px 11px;
        font-size: 9px;
    }
}
</style>
</head>

function openOthers() {
    const modal=document.getElementById("modal");
    document.getElementById("modalTitle").textContent="✦ OTHERS DIRECTORY ✦";
    const area=document.getElementById("modalOptions");
    area.innerHTML="";
    const search=document.createElement("input");
    search.className="others-search"; search.type="search"; search.placeholder="⌕ Search websites..."; search.setAttribute("aria-label","Search websites");
    const count=document.createElement("div"); count.className="others-count";
    const list=document.createElement("div"); list.className="others-list";
    area.append(search,count,list);
    function render(){
      const q=search.value.trim().toLowerCase(); list.innerHTML="";
      const matches=otherSites.filter(x=>x[0].toLowerCase().includes(q)||x[1].toLowerCase().includes(q));
      count.textContent=matches.length+" / "+otherSites.length+" WEBSITES";
      matches.forEach(x=>{const a=document.createElement("a");a.className="option";a.href=x[1];a.target="_blank";a.rel="noopener noreferrer";a.textContent="↗  "+x[0];list.appendChild(a);});
      if(!matches.length){const empty=document.createElement("p");empty.textContent="No websites match that search.";empty.style.cssText="text-align:center;color:#aaa;padding:20px";list.appendChild(empty);}
    }
    search.addEventListener("input",render); render(); modal.classList.add("active");
}

function closeModal() {

    document.getElementById("modal").classList.remove("active");

}

document.getElementById("modal").addEventListener("click", function(event) {

    if (event.target === this) {
        closeModal();
    }

});
