<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    overflow-x: hidden;

    font-family: "Rajdhani", sans-serif;
    color: white;

    background:
        radial-gradient(
            ellipse at 50% 65%,
            rgba(0, 170, 255, .20),
            transparent 40%
        ),
        radial-gradient(
            ellipse at 20% 20%,
            rgba(130, 0, 255, .18),
            transparent 35%
        ),
        radial-gradient(
            ellipse at 80% 20%,
            rgba(255, 0, 180, .14),
            transparent 35%
        ),
        linear-gradient(
            #02030a,
            #06091a 50%,
            #010207
        );

    background-attachment: fixed;
}


/* =====================================================
   SKY
===================================================== */

.sky {
    position: fixed;
    inset: 0;

    z-index: 0;

    pointer-events: none;

    overflow: hidden;
}

.sky::before {
    content: "";

    position: absolute;
    inset: 0;

    background-image:
        radial-gradient(
            circle,
            rgba(255,255,255,.7) 1px,
            transparent 1px
        ),
        radial-gradient(
            circle,
            rgba(0,255,255,.5) 1px,
            transparent 1px
        );

    background-size:
        90px 90px,
        150px 150px;

    background-position:
        10px 20px,
        60px 80px;

    opacity: .35;
}


/* =====================================================
   MOON
===================================================== */

.moon {
    position: absolute;

    width: 170px;
    height: 170px;

    border-radius: 50%;

    right: 9%;
    top: 9%;

    background:
        radial-gradient(
            circle at 35% 35%,
            #ffffff,
            #b9dfff 45%,
            #7194bd 75%,
            #31415e
        );

    box-shadow:
        0 0 30px rgba(150,220,255,.35),
        0 0 100px rgba(70,140,255,.18);

    opacity: .7;
}


/* =====================================================
   CITY
===================================================== */

.city {
    position: fixed;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 58vh;

    z-index: 1;

    display: flex;

    align-items: flex-end;
    justify-content: center;

    gap: 5px;

    pointer-events: none;

    overflow: hidden;

    filter:
        drop-shadow(
            0 -5px 20px rgba(0,255,255,.08)
        );
}


/* =====================================================
   BUILDINGS
===================================================== */

.building {
    position: relative;

    flex-shrink: 0;

    width: clamp(38px, 5vw, 85px);

    background:
        linear-gradient(
            90deg,
            #03040a,
            #111522,
            #070812
        );

    border-top:
        1px solid rgba(120,220,255,.18);

    box-shadow:
        inset 7px 0 15px rgba(0,0,0,.65),
        inset -7px 0 15px rgba(0,0,0,.65);
}


/* =====================================================
   BUILDING HEIGHTS
===================================================== */

.b1 { height: 32%; }
.b2 { height: 48%; }
.b3 { height: 38%; }
.b4 { height: 60%; }
.b5 { height: 43%; }
.b7 { height: 52%; }
.b9 { height: 44%; }
.b10 { height: 64%; }
.b12 { height: 70%; }
.b14 { height: 80%; }
.b16 { height: 62%; }
.b18 { height: 50%; }
.b19 { height: 73%; }
.b20 { height: 37%; }
.b21 { height: 67%; }
.b22 { height: 45%; }
.b23 { height: 84%; }
.b24 { height: 57%; }
.b25 { height: 40%; }


/* =====================================================
   WINDOWS
===================================================== */

.building::after {
    content: "";

    position: absolute;

    top: 12px;
    left: 8px;
    right: 8px;
    bottom: 8px;

    background-image:
        linear-gradient(
            90deg,
            transparent 0 65%,
            rgba(0,220,255,.55) 66% 70%,
            transparent 71%
        ),
        linear-gradient(
            0deg,
            transparent 0 65%,
            rgba(255,210,90,.45) 66% 72%,
            transparent 73%
        );

    background-size:
        17px 24px,
        17px 24px;

    opacity: .42;
}


/* =====================================================
   EMPIRE STATE STYLE
===================================================== */

.empire {
    width: clamp(65px, 7vw, 105px);

    height: 82%;

    background:
        linear-gradient(
            90deg,
            #05060c,
            #151827,
            #05060c
        );

    clip-path: polygon(
        10% 100%,
        10% 28%,
        22% 28%,
        22% 17%,
        34% 17%,
        34% 10%,
        43% 10%,
        48% 0%,
        52% 0%,
        57% 10%,
        66% 10%,
        66% 17%,
        78% 17%,
        78% 28%,
        90% 28%,
        90% 100%
    );
}

.empire::before {
    content: "";

    position: absolute;

    left: 50%;
    top: -19%;

    width: 3px;
    height: 20%;

    transform: translateX(-50%);

    background: #e4fbff;

    box-shadow:
        0 0 7px #00ffff,
        0 0 18px #00ffff;
}


/* =====================================================
   ONE WORLD TRADE CENTER STYLE
===================================================== */

.wtc {
    width: clamp(60px, 7vw, 110px);

    height: 96%;

    background:
        linear-gradient(
            90deg,
            #050812,
            #17253c,
            #07101e
        );

    clip-path: polygon(
        20% 100%,
        25% 12%,
        35% 5%,
        50% 0%,
        65% 5%,
        75% 12%,
        80% 100%
    );

    box-shadow:
        0 0 30px rgba(0,180,255,.15);
}

.wtc::before {
    content: "";

    position: absolute;

    width: 3px;
    height: 23%;

    left: 50%;
    top: -20%;

    transform: translateX(-50%);

    background: #b8f8ff;

    box-shadow:
        0 0 8px #00ffff,
        0 0 20px #00ffff,
        0 0 40px #00ffff;
}

.wtc::after {
    opacity: .65;

    background-image:
        linear-gradient(
            90deg,
            transparent 45%,
            rgba(0,230,255,.75) 46% 52%,
            transparent 53%
        ),
        linear-gradient(
            0deg,
            transparent 45%,
            rgba(100,220,255,.6) 46% 50%,
            transparent 51%
        );

    background-size:
        15px 27px;
}


/* =====================================================
   ROUND TOWER
===================================================== */

.round-tower {
    width: clamp(50px, 6vw, 90px);

    height: 72%;

    border-radius: 50% 50% 0 0;

    background:
        linear-gradient(
            90deg,
            #03050c,
            #1b2338,
            #050812
        );
}

.round-tower::before {
    content: "";

    position: absolute;

    top: -10%;
    left: 20%;

    width: 60%;
    height: 14%;

    border-radius: 50%;

    background: #17233a;

    border:
        1px solid rgba(0,255,255,.25);
}


/* =====================================================
   NEON BUILDING
===================================================== */

.neon-building {
    height: 68%;

    background:
        linear-gradient(
            90deg,
            #08040d,
            #190d24,
            #08040d
        );

    border-left:
        2px solid rgba(255,0,200,.3);

    border-right:
        2px solid rgba(0,255,255,.25);
}

.neon-building::before {
    content: "CITY";

    position: absolute;

    top: 20px;
    left: 50%;

    transform: translateX(-50%);

    padding: 5px 8px;

    font-family: Orbitron, sans-serif;

    font-size: 9px;

    letter-spacing: 2px;

    color: white;

    border:
        1px solid #ff00cc;

    box-shadow:
        0 0 8px #ff00cc,
        inset 0 0 8px rgba(255,0,200,.3);

    text-shadow:
        0 0 8px #ff00cc;

    opacity: .8;
}


/* =====================================================
   TALL BUILDINGS
===================================================== */

.tall {
    height: 77%;
}

.tall::before {
    content: "";

    position: absolute;

    width: 2px;
    height: 22%;

    top: -22%;
    left: 50%;

    background: #00ffff;

    box-shadow:
        0 0 8px #00ffff,
        0 0 18px #00ffff;
}


/* =====================================================
   CITY HAZE
===================================================== */

.city-lights {
    position: fixed;

    bottom: 0;
    left: 0;

    width: 100%;
    height: 40vh;

    z-index: 2;

    pointer-events: none;

    background:
        linear-gradient(
            to top,
            rgba(0,0,0,.85),
            transparent 70%
        );
}


/* =====================================================
   STREET
===================================================== */

.street {
    position: fixed;

    bottom: 0;
    left: 0;

    width: 100%;
    height: 13vh;

    z-index: 3;

    pointer-events: none;

    background:
        linear-gradient(
            to bottom,
            rgba(4,8,16,.2),
            #020207
        );

    border-top:
        1px solid rgba(0,255,255,.12);
}

.street::before {
    content: "";

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            rgba(0,255,255,.14) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(0,255,255,.14) 1px,
            transparent 1px
        );

    background-size:
        45px 30px;

    transform:
        perspective(250px)
        rotateX(55deg);

    transform-origin: bottom;

    opacity: .5;

    animation:
        roadMove 4s linear infinite;
}

@keyframes roadMove {

    from {
        background-position: 0 0;
    }

    to {
        background-position: 0 30px;
    }
}


/* =====================================================
   ROAD LIGHTS
===================================================== */

.road-light {
    position: fixed;

    bottom: 8%;

    width: 6px;
    height: 6px;

    border-radius: 50%;

    z-index: 4;

    background: #00ffff;

    box-shadow:
        0 0 8px #00ffff,
        0 0 20px #00ffff;

    animation:
        roadGlow 2s infinite alternate;

    pointer-events: none;
}

.road-light:nth-of-type(1) {
    left: 15%;
}

.road-light:nth-of-type(2) {
    left: 32%;

    background: #ff00cc;

    box-shadow:
        0 0 8px #ff00cc,
        0 0 20px #ff00cc;
}

.road-light:nth-of-type(3) {
    left: 70%;
}

.road-light:nth-of-type(4) {
    left: 88%;

    background: #8c70ff;

    box-shadow:
        0 0 8px #8c70ff,
        0 0 20px #8c70ff;
}

@keyframes roadGlow {

    from {
        opacity: .35;
    }

    to {
        opacity: 1;
    }
}


/* =====================================================
   MAIN CONTAINER
===================================================== */

.container {
    position: relative;

    z-index: 10;

    width: min(900px, calc(100% - 30px));

    margin: 60px auto;

    padding: 40px 30px;

    border-radius: 30px;

    background:
        linear-gradient(
            135deg,
            rgba(10,13,25,.82),
            rgba(20,10,30,.75)
        );

    border:
        1px solid rgba(255,255,255,.15);

    box-shadow:
        0 0 60px rgba(0,0,0,.75),
        0 0 100px rgba(0,200,255,.05),
        inset 0 0 30px rgba(255,255,255,.025);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
}


/* =====================================================
   HEADER
===================================================== */

.header {
    text-align: center;

    margin-bottom: 35px;
}

.header h1 {
    font-family: Orbitron, sans-serif;

    font-size: clamp(32px,7vw,62px);

    font-weight: 900;

    letter-spacing: 5px;

    background:
        linear-gradient(
            90deg,
            #fff,
            #00ffff,
            #8d6cff,
            #ff36d7,
            #fff
        );

    background-size: 300% auto;

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;

    animation:
        titleGlow 5s linear infinite;

    filter:
        drop-shadow(
            0 0 12px rgba(0,255,255,.3)
        );
}

@keyframes titleGlow {

    to {
        background-position: 300% center;
    }
}

.header p {
    margin-top: 10px;

    font-size: 18px;

    color:
        rgba(255,255,255,.65);

    letter-spacing: 3px;
}


/* =====================================================
   DIVIDER
===================================================== */

.divider {
    width: 100%;
    height: 1px;

    margin: 30px 0;

    background:
        linear-gradient(
            90deg,
            transparent,
            #00ffff,
            #7b5cff,
            #ff00cc,
            transparent
        );

    box-shadow:
        0 0 15px rgba(0,255,255,.4);
}


/* =====================================================
   CARDS
===================================================== */

.classroom-card {
    width: 100%;
    max-width: 420px;

    margin: 30px auto 0;

    padding: 18px;

    background:
        linear-gradient(
            135deg,
            rgba(70,70,80,.9),
            rgba(35,35,45,.92)
        );

    border:
        1px solid rgba(255,255,255,.20);

    border-radius: 22px;

    box-shadow:
        0 10px 35px rgba(0,0,0,.6),
        0 0 25px rgba(0,255,255,.04),
        inset 0 0 25px rgba(255,255,255,.04);

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
}


/* =====================================================
   CARD TITLE
===================================================== */

.classroom-title {
    text-align: center;

    margin-bottom: 14px;

    color: white;

    font-family: Orbitron, sans-serif;

    font-size: 22px;

    font-weight: 800;

    letter-spacing: 4px;

    text-shadow:
        0 0 10px rgba(255,255,255,.3),
        0 0 20px rgba(0,255,255,.2);
}


/* =====================================================
   CARD IMAGE
===================================================== */

.classroom-image {
    width: 100%;
    height: 230px;

    overflow: hidden;

    border-radius: 16px;

    background: #3d3d42;

    border:
        1px solid rgba(255,255,255,.15);

    box-shadow:
        inset 0 0 20px rgba(0,0,0,.55);
}

.classroom-image img {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;

    transition: .4s ease;
}

.classroom-image:hover img {
    transform: scale(1.05);

    filter:
        brightness(1.1)
        saturate(1.15);
}


/* =====================================================
   PLAY BUTTON
===================================================== */

.classroom-play {
    width: 100%;
    height: 55px;

    margin-top: 13px;

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 10px;

    border-radius: 14px;

    color: white;

    font-family: Orbitron, sans-serif;

    font-size: 16px;

    font-weight: 800;

    letter-spacing: 3px;

    background:
        linear-gradient(
            135deg,
            #555,
            #777,
            #444
        );

    border:
        1px solid rgba(255,255,255,.25);

    box-shadow:
        0 0 15px rgba(255,255,255,.08),
        inset 0 0 12px rgba(255,255,255,.08);

    transition: .25s ease;

    cursor: pointer;
}

.classroom-play:hover {
    transform: translateY(-3px);

    background:
        linear-gradient(
            135deg,
            #666,
            #888,
            #555
        );

    box-shadow:
        0 0 25px rgba(255,255,255,.18),
        0 8px 25px rgba(0,0,0,.4);
}

.classroom-play:active {
    transform: scale(.97);
}


/* =====================================================
   LINK MENU
===================================================== */

.link-menu {
    display: none;

    margin-top: 12px;

    padding: 12px;

    border-radius: 16px;

    background:
        rgba(12,12,18,.96);

    border:
        1px solid rgba(255,255,255,.16);

    box-shadow:
        0 10px 30px rgba(0,0,0,.55),
        inset 0 0 20px rgba(255,255,255,.025);

    animation:
        menuOpen .2s ease;
}

.link-menu.show {
    display: block;
}

@keyframes menuOpen {

    from {
        opacity: 0;
        transform: translateY(-8px) scale(.97);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}


/* =====================================================
   MENU LINKS
===================================================== */

.menu-link {
    width: 100%;

    display: flex;

    align-items: center;
    justify-content: space-between;

    padding: 14px 16px;

    margin-bottom: 8px;

    border-radius: 12px;

    color: white;

    text-decoration: none;

    font-family: Orbitron, sans-serif;

    font-size: 13px;

    font-weight: 700;

    letter-spacing: 2px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.08),
            rgba(255,255,255,.025)
        );

    border:
        1px solid rgba(255,255,255,.12);

    transition: .2s ease;
}

.menu-link:last-child {
    margin-bottom: 0;
}

.menu-link:hover {
    transform: translateX(4px);

    border-color:
        rgba(0,255,255,.5);

    background:
        linear-gradient(
            135deg,
            rgba(0,255,255,.12),
            rgba(255,0,220,.08)
        );

    box-shadow:
        0 0 18px rgba(0,255,255,.10);
}

.menu-arrow {
    opacity: .6;
}


/* =====================================================
   FOOTER
===================================================== */

.footer {
    text-align: center;

    margin-top: 35px;

    color:
        rgba(255,255,255,.4);

    font-size: 14px;

    letter-spacing: 2px;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width:600px) {

    .container {
        width: calc(100% - 20px);

        margin: 20px auto;

        padding: 25px 15px;

        border-radius: 22px;
    }

    .header h1 {
        letter-spacing: 2px;
    }

    .header p {
        font-size: 14px;
    }

    .classroom-image {
        height: 200px;
    }

    .city {
        height: 40vh;
    }

    .building {
        width: 27px;
    }

    .wtc {
        width: 45px;
    }

    .empire {
        width: 45px;
    }

    .moon {
        width: 100px;
        height: 100px;

        right: 5%;
    }
}


/* =====================================================
   REDUCE MOTION
===================================================== */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
    }
}

</style>
</head>

<main class="container">

<script>

/* =====================================================
   CLASSROOM LINK MENU
===================================================== */

function toggleLinks() {

    const menu =
        document.getElementById("linkMenu");

    menu.classList.toggle("show");

}


/* =====================================================
   CLOSE MENU OUTSIDE
===================================================== */

document.addEventListener("click", function(event) {

    const card =
        document.querySelector(".classroom-card");

    const menu =
        document.getElementById("linkMenu");

    if (!card.contains(event.target)) {

        menu.classList.remove("show");

    }

});

</script>
